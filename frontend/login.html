<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <section class="login-container">

        <!-- Left Side Image -->

        <div class="login-image">

            <img src="images/login-shoe.jpg" alt="login image">

        </div>


        <!-- Right Side Form -->

        <div class="login-form-container">

            <form id="login-form">

                <h1>Log in</h1>

                <!-- Username -->

                <div class="input-box">

                    <i class="fas fa-user"></i>

                    <input
    type="email"
    id="username"
    placeholder="Email"
    required>

                </div>


                <!-- Password -->

                <div class="input-box">

                    <i class="fas fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                </div>


                <!-- Options -->

                <div class="login-options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">

                        Forgot Password?

                    </a>

                </div>


                <!-- Button -->

                <button type="submit" class="login-btn">

                    Log in

                </button>


                <!-- Register -->

                <p class="signup-text">

                    or <a href="register.html">Sign up</a>

                </p>

            </form>

        </div>

    </section>

    <script src="js/login.js"></script>

</body>

</html>
